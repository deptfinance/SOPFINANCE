<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOP / Alur Kerja Harian</title>
  <style>
    :root {
      --navy: #12345b;
      --blue: #246fa8;
      --sky: #d9eef9;
      --aqua: #2fb7b2;
      --aqua-soft: #e7f8f7;
      --green: #1b7a55;
      --teal-deep: #087b78;
      --paper: #f8fbfd;
      --white: #ffffff;
      --orange: #f39a35;
      --orange-soft: #fff0dd;
      --ink: #163047;
      --muted: #647589;
      --line: #c7dceb;
      --shadow: 0 18px 45px rgba(18, 52, 91, 0.14);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        linear-gradient(rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.72)),
        repeating-linear-gradient(90deg, rgba(18, 52, 91, 0.045) 0 1px, transparent 1px 92px),
        repeating-linear-gradient(0deg, rgba(47, 183, 178, 0.04) 0 1px, transparent 1px 92px),
        linear-gradient(135deg, rgba(217, 238, 249, 0.95), rgba(231, 248, 247, 0.8) 42%, #ffffff 100%);
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    ::selection {
      color: var(--white);
      background: var(--teal-deep);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .page-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 20px;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 14px 34px rgba(18, 52, 91, 0.1);
      backdrop-filter: blur(14px);
      isolation: isolate;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border-radius: 8px;
      color: var(--white);
      background: linear-gradient(145deg, var(--navy), var(--aqua));
      box-shadow: 0 10px 24px rgba(18, 52, 91, 0.18);
      font-size: 24px;
      font-weight: 800;
    }

    .brand h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.12;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-end;
      gap: 8px;
      border: 1px solid rgba(18, 52, 91, 0.08);
      border-radius: 999px;
      padding: 6px;
      background: rgba(217, 238, 249, 0.48);
      max-width: 100%;
      overflow-x: auto;
    }

    .tab-button {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--navy);
      background: transparent;
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease, color 160ms ease;
      white-space: nowrap;
    }

    .tab-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(18, 52, 91, 0.12);
    }

    .tab-button.active {
      border-color: rgba(18, 52, 91, 0.18);
      color: var(--white);
      background: linear-gradient(135deg, var(--navy), #1a5d8e);
      box-shadow: 0 10px 20px rgba(18, 52, 91, 0.18);
    }

    .poster {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(18, 52, 91, 0.1);
      border-radius: 8px;
      background: var(--white);
      box-shadow: var(--shadow);
      will-change: transform, opacity;
    }

    .poster::before {
      position: absolute;
      inset: 0 0 auto;
      z-index: 2;
      height: 4px;
      content: "";
      background: linear-gradient(90deg, var(--aqua), var(--blue), var(--orange));
    }

    .poster.flip-out {
      animation: profileFadeOut 150ms ease-in forwards;
    }

    .poster.flip-in {
      animation: profileFadeIn 220ms ease-out both;
    }

    @keyframes profileFadeOut {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-8px);
      }
    }

    @keyframes profileFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .profile-hero {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 22px;
      padding: 30px;
      color: var(--white);
      background:
        linear-gradient(130deg, rgba(18, 52, 91, 0.98), rgba(30, 98, 144, 0.96) 52%, rgba(27, 122, 85, 0.92));
    }

    .profile-hero::after {
      position: absolute;
      inset: 0;
      content: "";
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 42%, rgba(255, 255, 255, 0.11) 42% 43%, transparent 43% 100%),
        repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.07) 0 1px, transparent 1px 72px);
      opacity: 0.62;
    }

    .poster[data-profile="delia"] .profile-hero {
      background: linear-gradient(130deg, #0d3163, #155c9c 55%, #0f7f73);
    }

    .poster[data-profile="adelia"] .profile-hero {
      background: linear-gradient(130deg, #103a77, #2478a9 55%, #0b8a80);
    }

    .poster[data-profile="erika"] .profile-hero {
      background: linear-gradient(130deg, #102c59, #24639b 52%, #5b3b8f);
    }

    .person-title {
      position: relative;
      z-index: 1;
      display: flex;
      gap: 18px;
      align-items: center;
      min-width: 0;
    }

    .avatar-main {
      display: grid;
      width: 184px;
      height: 184px;
      flex: 0 0 184px;
      place-items: center;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      box-shadow: 0 18px 34px rgba(6, 22, 40, 0.24);
      font-size: 76px;
    }

    .avatar-main img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name-line {
      margin: 0;
      font-size: clamp(28px, 4.5vw, 52px);
      line-height: 1;
      text-shadow: 0 8px 20px rgba(6, 22, 40, 0.18);
    }

    .title-line {
      margin: 8px 0 0;
      color: rgba(255, 255, 255, 0.88);
      font-size: clamp(16px, 2vw, 22px);
      line-height: 1.35;
    }

    .profile-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 7px 10px;
      color: rgba(255, 255, 255, 0.94);
      background: rgba(255, 255, 255, 0.14);
      font-size: 13px;
      font-weight: 800;
      line-height: 1;
      backdrop-filter: blur(8px);
    }

    .jobdesk-section {
      border-bottom: 1px solid rgba(18, 52, 91, 0.1);
      padding: 26px 28px 28px;
      background: var(--white);
    }

    .jobdesk-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .jobdesk-item {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border: 1px solid rgba(27, 122, 85, 0.18);
      border-radius: var(--radius);
      padding: 12px;
      background: linear-gradient(180deg, #ffffff, #f4faf6);
    }

    .jobdesk-number {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 50%;
      color: var(--white);
      background: var(--green);
      font-size: 12px;
      font-weight: 800;
    }

    .jobdesk-text {
      min-width: 0;
    }

    .jobdesk-text p {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.4;
    }

    .jobdesk-text p[lang="zh-Hant"] {
      margin-top: 3px;
      color: var(--muted);
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .category-card {
      border: 1px solid rgba(18, 52, 91, 0.1);
      border-radius: var(--radius);
      padding: 18px;
      background: linear-gradient(180deg, #ffffff, var(--paper));
      box-shadow: 0 10px 24px rgba(18, 52, 91, 0.07);
    }

    .category-card h3 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 16px;
      letter-spacing: 0.01em;
    }

    .category-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .category-list li {
      position: relative;
      padding-left: 18px;
      color: var(--ink);
      font-size: 13.5px;
      line-height: 1.5;
    }

    .category-list li::before {
      position: absolute;
      left: 0;
      color: var(--aqua);
      content: "▸";
      font-weight: 800;
    }

    .category-zh {
      display: inline-block;
      margin-top: 3px;
      color: var(--muted);
    }

    .content-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 24px;
      padding: 28px;
      background: linear-gradient(180deg, #ffffff, var(--paper));
    }

    .content-grid.wide {
      grid-template-columns: 1fr;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(18, 52, 91, 0.1);
      padding-bottom: 12px;
    }

    .section-head h2 {
      margin: 0;
      color: var(--navy);
      font-size: 24px;
      line-height: 1.15;
    }

    .section-head span {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }

    .timeline {
      position: relative;
      display: grid;
      gap: 16px;
    }

    .timeline::before {
      position: absolute;
      top: 18px;
      bottom: 18px;
      left: 31px;
      width: 3px;
      content: "";
      background: linear-gradient(180deg, var(--aqua), var(--blue));
      border-radius: 999px;
    }

    .timeline.no-time::before {
      display: none;
    }

    .activity-card {
      position: relative;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 14px;
      align-items: stretch;
      animation: activityRise 360ms ease both;
      animation-delay: calc(var(--i, 0) * 34ms);
      transition: transform 160ms ease, filter 160ms ease;
    }

    @keyframes activityRise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .activity-card:hover {
      transform: translateY(-2px);
      filter: drop-shadow(0 14px 18px rgba(18, 52, 91, 0.08));
    }

    .activity-card.no-time {
      grid-template-columns: 72px minmax(0, 1fr);
    }

    .activity-marker {
      position: relative;
      z-index: 1;
      display: grid;
      align-content: start;
      justify-items: center;
      gap: 6px;
    }

    .step-number,
    .break-icon,
    .task-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 3px solid var(--white);
      border-radius: 50%;
      color: var(--white);
      background: var(--blue);
      box-shadow: 0 9px 18px rgba(18, 52, 91, 0.18);
      font-weight: 800;
    }

    .task-icon {
      width: 54px;
      height: 54px;
      color: var(--blue);
      background: var(--sky);
      font-size: 27px;
    }

    .break-icon {
      background: var(--orange);
      font-size: 21px;
    }

    .time-chip {
      width: 64px;
      border-radius: 999px;
      padding: 4px 6px;
      color: var(--navy);
      background: #eef8fc;
      box-shadow: inset 0 0 0 1px rgba(47, 183, 178, 0.13);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
    }

    .activity-body {
      border: 1px solid rgba(18, 52, 91, 0.1);
      border-left: 5px solid var(--aqua);
      border-radius: var(--radius);
      padding: 16px;
      background: linear-gradient(180deg, #ffffff, #fbfdff);
      box-shadow: 0 10px 24px rgba(18, 52, 91, 0.07);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .activity-card:hover .activity-body {
      border-color: rgba(47, 183, 178, 0.4);
      box-shadow: 0 14px 30px rgba(18, 52, 91, 0.1);
    }

    .activity-card.break .activity-body {
      border-left-color: var(--orange);
      background: var(--orange-soft);
    }

    .activity-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 11px;
    }

    .activity-card.no-time .activity-heading {
      display: none;
    }

    .mini-avatar {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border-radius: 8px;
      color: var(--navy);
      background: var(--aqua-soft);
      font-size: 22px;
      box-shadow: inset 0 0 0 1px rgba(47, 183, 178, 0.1);
    }

    .activity-card.break .mini-avatar {
      background: #ffe1bb;
    }

    .period {
      margin-left: auto;
      border-radius: 999px;
      padding: 5px 9px;
      color: var(--white);
      background: linear-gradient(135deg, var(--navy), #194f79);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .activity-card.break .period {
      background: var(--orange);
    }

    .bilingual {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
    }

    .lang-block {
      min-width: 0;
    }

    .lang-tag {
      display: inline-flex;
      margin-bottom: 7px;
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--blue);
      background: var(--sky);
      font-size: 11px;
      font-weight: 800;
    }

    .lang-block h3 {
      margin: 0;
      color: var(--navy);
      font-size: 18px;
      line-height: 1.32;
    }

    .lang-block p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .output-panel {
      align-self: start;
      border: 1px solid rgba(18, 52, 91, 0.1);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--white);
      box-shadow: 0 12px 28px rgba(18, 52, 91, 0.09);
      position: sticky;
      top: 104px;
    }

    .output-header {
      padding: 18px;
      color: var(--white);
      background: linear-gradient(135deg, var(--navy), var(--blue) 58%, var(--green));
    }

    .output-header h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
    }

    .output-header p {
      margin: 6px 0 0;
      color: rgba(255, 255, 255, 0.84);
      font-size: 13px;
    }

    .output-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 16px;
      list-style: none;
    }

    .output-list li {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 10px;
      align-items: start;
      border: 1px solid rgba(47, 183, 178, 0.18);
      border-radius: var(--radius);
      padding: 11px;
      background: linear-gradient(180deg, #f8ffff, var(--aqua-soft));
      font-size: 14px;
      line-height: 1.45;
    }

    .check {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      color: var(--white);
      background: var(--aqua);
      font-weight: 800;
    }

    .placeholder-note {
      margin: 0;
      border-top: 1px solid rgba(18, 52, 91, 0.1);
      padding: 14px 18px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    footer {
      margin-top: 18px;
      border-radius: 8px;
      padding: 16px;
      color: var(--white);
      background: linear-gradient(135deg, var(--navy), #174f77);
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 980px) {
      .topbar,
      .content-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        display: grid;
      }

      .tabs {
        justify-content: flex-start;
        border-radius: 8px;
      }

      .content-grid {
        gap: 18px;
      }

      .output-panel {
        position: static;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .poster.flip-out,
      .poster.flip-in,
      .activity-card {
        animation: none;
      }
    }

    @media (max-width: 680px) {
      .page-shell {
        width: min(100% - 20px, 1180px);
        padding-top: 14px;
      }

      .brand {
        align-items: flex-start;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
        font-size: 21px;
      }

      .tab-button {
        flex: 1 1 calc(50% - 8px);
        padding-inline: 10px;
      }

      .profile-hero,
      .content-grid {
        padding: 16px;
      }

      .person-title {
        align-items: flex-start;
      }

      .avatar-main {
        width: 132px;
        height: 132px;
        flex-basis: 132px;
        font-size: 56px;
      }

      .section-head {
        display: grid;
      }

      .section-head span {
        text-align: left;
      }

      .timeline::before {
        left: 23px;
      }

      .activity-card {
        grid-template-columns: 48px minmax(0, 1fr);
        gap: 10px;
      }

      .activity-card.no-time {
        grid-template-columns: 58px minmax(0, 1fr);
      }

      .step-number,
      .break-icon {
        width: 36px;
        height: 36px;
      }

      .task-icon {
        width: 46px;
        height: 46px;
        font-size: 23px;
      }

      .time-chip {
        width: 48px;
        font-size: 10px;
      }

      .activity-heading {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .period {
        margin-left: 0;
      }

      .bilingual {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">S</div>
        <div>
          <h1>SOP / Alur Kerja Harian</h1>
        </div>
      </div>
      <nav class="tabs" aria-label="Pilih profile SOP" id="profileTabs"></nav>
    </header>

    <section class="poster" id="profilePoster" aria-live="polite"></section>

    <footer>
      Disiplin waktu, data akurat, hasil kerja berkualitas. ｜ 守時自律、資料準確、工作成果有品質。
    </footer>
  </main>

  <script>
    const profiles = [
      {
        id: "dhea",

        title: "SOP / Alur Kerja Harian DHEA",

        focusZh: "檢查訊息、採購申請、報銷申請、印尼盾付款、KTA 提款、報表與期末餘額",
        avatar: {
          type: "image",
          value: "👩‍💼",
          image: "assets/avatar-dhea.png"
        },
        jobdeskCategories: [
          {
            title: "HUTANG USAHA 應付帳款",
            items: [
              { id: "MEMERIKSA TAGIHAN PEMBAYARAN DARI PIHAK EKSTERNAL YANG DIKIRIMKAN OLEH AKUNTING", zh: "核對會計部門所傳送的外部廠商應付款項帳單" },
              { id: "MELAKUKAN PENGINPUTAN KE REKENING SETELAH DOKUMEN SUDAH SESUAI", zh: "確認文件無誤後，進行帳戶輸入作業" }
            ]
          },
          {
            title: "PENGAJUAN BIAYA PEMBELIAN 採購費用申請",
            items: [
              { id: "MEMERIKSA LAPORAN PENGAJUAN PEMBELIAN YANG DIKIRIMKAN OLEH KARYAWAN", zh: "核對員工所提交的採購申請報告" },
              { id: "MEMERIKSA BUKTI PEMBAYARAN DAN BUKTI ACC ATASAN", zh: "核查付款憑證及上級批准憑證" },
              { id: "MENGAJUKAN PEMBAYARAN KE CE LUSI SETELAH DATA SUDAH SESUAI", zh: "確認資料無誤後，向露西姐提出付款申請" }
            ]
          },
          {

            period: "Siang / Sore ｜ 下午 / 傍晚",

            idTitle: "Merapikan dan memeriksa laporan",
            idDescription: "Merapikan dan memeriksa laporan.",
            zhTitle: "整理並核對報表",
            zhDescription: "整理並核對報表。"
          },
          {
            time: "16.30–16.45",
            period: "Siang / Sore ｜ 下午 / 傍晚",

            idTitle: "Membuat laporan arus kas untuk 汶姐",
            idDescription: "Membuat laporan arus kas untuk 汶姐.",
            zhTitle: "製作現金流量表給汶姐",

          }
        ],
        jobdeskCategories: [
          {
            title: "PEMBAYARAN PIUTANG USAHA (RUPIAH MASUK) 應收帳款收款（印尼盾收入）",
            items: [
              { id: "MEMERIKSA DAN MENCOCOKKAN BUKTI PEMBAYARAN DENGAN MUTASI REKENING", zh: "核對付款憑證與帳戶交易明細" },
              { id: "MEMBUAT LAPORAN PEMBAYARAN PIUTANG MASUK", zh: "製作應收帳款收款報告" },

          {

            items: [

              { id: "MEMERIKSA DOKUMEN, SISTEM, DAN DATA REKENING APAKAH SUDAH SESUAI DENGAN DATA EXCEL PENCAIRAN", zh: "核對文件、系統及帳戶數據是否與撥款Excel數據相符" },
              { id: "MELAKUKAN INPUT PADA REKENING BRI", zh: "在BRI帳戶進行輸入作業" },
              { id: "MENGAMBIL BUKTI PENCAIRAN DAN MELAKUKAN INPUT PADA SISTEM", zh: "取得撥款憑證並輸入至系統中" }
            ]
          },
          {
            title: "LAPORAN HARIAN 每日報表",
            items: [

              { id: "MENGUMPULKAN BUKTI TRANSAKSI", zh: "收集交易憑證" }
            ]
          }
        ]
      }),
      createPlaceholderProfile({
        id: "elisa",
        displayName: "艾莉莎 / ELISA",
        shortName: "ELISA",
        image: "assets/avatar-elisa.jpg",
        jobdeskCategories: [
          {
            title: "GAJI 薪資",
            items: [
              { id: "MENGKONFIRMASI DATA ABSENSI KARYAWAN KEPADA MASING-MASING KETUA DIVISI", zh: "向各部門主管確認員工出勤數據" },
              { id: "MENGUMPULKAN RINCIAN DATA KARYAWAN BARU/RESIGN, CUTI, IZIN, DAN SAKIT (BESERTA SURAT SAKIT)", zh: "收集新進／離職員工、年假、事假及病假（附病假證明）之詳細資料" },
              { id: "MENYIAPKAN PERHITUNGAN GAJI MASING-MASING KARYAWAN", zh: "準備各員工薪資計算表" },
              { id: "MELAKUKAN TRANSFER GAJI KEPADA SETIAP KARYAWAN JIKA SUDAH DISETUJUI", zh: "獲得批准後，對每位員工進行薪資轉帳" }
            ]
          },
          {
            title: "BONUS 獎金",
            items: [
              { id: "MEMBUAT LIST BONUS YANG AKAN DIKERJAKAN", zh: "製作待處理獎金清單" },
              { id: "MENGUMPULKAN DATA BONUS MELALUI TARIKAN SISTEM DAN DATA DARI MASING-MASING KETUA DIVISI", zh: "透過系統提領及各部門主管所提供之資料收集獎金數據" },
              { id: "MERAPIKAN DAN MEMERIKSA KEMBALI DATA YANG SUDAH DIKUMPULKAN", zh: "整理並再次核對所收集之數據" },
              { id: "MENGKONFIRMASI DATA BONUS UNTUK MENDAPATKAN PERSETUJUAN DARI PIHAK TERKAIT", zh: "確認獎金數據以取得相關人員之批准" },
              { id: "MENGIRIMKAN DATA BONUS YANG SUDAH SESUAI KEPADA CE LUSIE", zh: "將已確認之獎金數據傳送給露西姐" },
              { id: "MENGINPUT BONUS YANG SUDAH DISETUJUI OLEH AKUNTING TAIWAN", zh: "輸入已獲台灣會計部門批准之獎金" }
            ]
          },
          {
            title: "LAPORAN HARIAN 每日報表",
            items: [
              { id: "MEMBUAT LAPORAN PEMBUKUAN SELURUH TRANSAKSI YANG TELAH DIJALANKAN", zh: "製作所有已執行交易之帳務報告" },
              { id: "MENCOCOKKAN SALDO AKHIR LAPORAN DENGAN MUTASI REKENING", zh: "核對報表期末餘額與帳戶交易明細" },
              { id: "MENGUMPULKAN BUKTI TRANSAKSI", zh: "收集交易憑證" }
            ]
          }
        ]
      })
    ];

    const tabsEl = document.querySelector("#profileTabs");
    const posterEl = document.querySelector("#profilePoster");
    let activeProfileId = "";
    let flipTimer = null;

    function createPlaceholderProfile({ id, displayName, shortName, image, jobdeskCategories, activities }) {
      return {
        id,
        displayName,
        shortName,
        title: `SOP / Alur Kerja Harian ${shortName}`,
        focusId: "Fokus pekerjaan akan diisi nanti",
        focusZh: "工作重點待補充",
        isPlaceholder: true,
        avatar: {
          type: image ? "image" : "emoji",
          value: "👤",
          image
        },
        ...(jobdeskCategories ? { jobdeskCategories } : {}),
        activities: activities || [
          createEmptyActivity("08.00–09.00", "Pagi ｜ 上午", 1),
          createEmptyActivity("09.00–10.00", "Pagi ｜ 上午", 2),
          createEmptyActivity("10.00–11.00", "Pagi ｜ 上午", 3),
          {
            time: "12.00–13.00",
            period: "Istirahat ｜ 休息",
            icon: "☕",
            isBreak: true,
            idTitle: "Istirahat",
            idDescription: "Isi detail istirahat bila diperlukan.",
            zhTitle: "休息",
            zhDescription: "如有需要可補充休息說明。"
          },
          createEmptyActivity("13.00–15.00", "Siang ｜ 下午", 4),
          createEmptyActivity("15.00–16.00", "Siang ｜ 下午", 5),
          createEmptyActivity("16.00–17.00", "Sore ｜ 傍晚", 6)
        ],
        outputs: [
          "Output harian 1 ｜ 每日成果 1",
          "Output harian 2 ｜ 每日成果 2",
          "Output harian 3 ｜ 每日成果 3",
          "Output harian 4 ｜ 每日成果 4"
        ]
      };
    }

    function createEmptyActivity(time, period, number) {
      return {
        time,
        period,
        icon: "📌",
        idTitle: `Kegiatan ${number}`,
        idDescription: "Deskripsi kegiatan akan diisi nanti.",
        zhTitle: `工作項目 ${number}`,
        zhDescription: "工作內容待補充。"
      };
    }

    function renderTabs(activeId) {
      tabsEl.innerHTML = profiles.map((profile) => `
        <button
          class="tab-button ${profile.id === activeId ? "active" : ""}"
          type="button"
          data-profile-id="${profile.id}"
          aria-selected="${profile.id === activeId}"
        >
          ${profile.displayName}
        </button>
      `).join("");
    }

    function renderCategoryCards(categories) {
      return categories.map((category) => `
        <article class="category-card">
          <h3>${category.title}</h3>
          <ul class="category-list">
            ${category.items.map((item) => {
              if (typeof item === "string") return `<li>${item}</li>`;
              return `<li>${item.id}<br><span class="category-zh" lang="zh-Hant">${item.zh}</span></li>`;
            }).join("")}
          </ul>
        </article>
      `).join("");
    }

    function renderProfile(profile) {
      const activities = profile.activities.map((activity, index) => {
        const stepNumber = activity.isBreak ? "" : index + 1 - countBreaksBefore(profile.activities, index);
        const hasTime = Boolean(activity.time);
        const markerClass = activity.isBreak ? "break-icon" : (hasTime ? "step-number" : "task-icon");
        const markerLabel = activity.isBreak ? activity.icon : (hasTime ? stepNumber : activity.icon);
        const timeChip = hasTime ? `<div class="time-chip">${activity.time}</div>` : "";
        const miniAvatar = hasTime ? `<div class="mini-avatar" aria-hidden="true">${activity.icon}</div>` : "";
        const period = activity.period ? `<span class="period">${activity.period}</span>` : "";
        return `
          <article class="activity-card ${activity.isBreak ? "break" : ""} ${hasTime ? "" : "no-time"}" style="--i: ${index}">
            <div class="activity-marker">
              <div class="${markerClass}">${markerLabel}</div>
              ${timeChip}
            </div>
            <div class="activity-body">
              <div class="activity-heading">
                ${miniAvatar}
                ${period}
              </div>
              <div class="bilingual">
                <div class="lang-block">
                  <h3>${activity.idTitle}</h3>
                  <p>${activity.idDescription}</p>
                </div>
                <div class="lang-block" lang="zh-Hant">
                  <h3>${activity.zhTitle}</h3>
                  <p>${activity.zhDescription}</p>
                </div>
              </div>
            </div>
          </article>
        `;
      }).join("");
      const jobdesk = profile.jobdeskCategories
        ? renderCategoryCards(profile.jobdeskCategories)
        : profile.activities.filter((activity) => !activity.isBreak).map((activity, index) => `
          <div class="jobdesk-item">
            <div class="jobdesk-number">${index + 1}</div>
            <div class="jobdesk-text">
              <p>${activity.idTitle}</p>
              <p lang="zh-Hant">${activity.zhTitle}</p>
            </div>
          </div>
        `).join("");
      const scheduledActivities = profile.activities.filter((activity) => activity.time && !activity.isBreak);
      const taskCount = profile.activities.filter((activity) => !activity.isBreak).length;
      const firstTime = scheduledActivities[0]?.time.split("–")[0] || "";
      const lastTime = scheduledActivities[scheduledActivities.length - 1]?.time.split("–")[1] || "";
      const timeSummary = firstTime && lastTime ? `${firstTime}–${lastTime}` : "Tanpa jam";
      posterEl.dataset.profile = profile.id;

      posterEl.innerHTML = `
        <div class="profile-hero">
          <div class="person-title">
            <div class="avatar-main" aria-label="Avatar ${profile.shortName}">
              ${renderAvatar(profile)}
            </div>
            <div>
              <h2 class="name-line">${profile.displayName}</h2>
              <div class="profile-stats" aria-label="Ringkasan profil">
                <span class="stat-pill">📌 ${taskCount} aktivitas ｜ ${taskCount} 項目</span>
                <span class="stat-pill">🕒 ${timeSummary}</span>
              </div>
            </div>
          </div>
        </div>

        <section class="jobdesk-section">
          <div class="section-head">
            <h2>JOBDESK DAN TANGGUNG JAWAB / 工作職責與職掌</h2>
            <span>Uraian tugas &amp; tanggung jawab harian ｜ 每日工作內容與職責</span>
          </div>
          <div class="${profile.jobdeskCategories ? "category-grid" : "jobdesk-grid"}">
            ${jobdesk}
          </div>
        </section>

        <div class="content-grid ${profile.hideOutput ? "wide" : ""}">
          <section>
            <div class="section-head">
              <h2>${profile.sectionTitle || "Jadwal Kegiatan Harian"}</h2>
              <span>${profile.sectionSubtitle || "Morning to afternoon workflow ｜ 每日工作流程"}</span>
            </div>
            <div class="timeline ${profile.activities.some((activity) => activity.time) ? "" : "no-time"}">${activities}</div>
          </section>

          ${profile.hideOutput ? "" : `
          <aside class="output-panel">
            <div class="output-header">
              <h2>Output Harian</h2>
              <p>Ringkasan hasil yang perlu selesai setiap hari</p>
            </div>
            <ol class="output-list">
              ${profile.outputs.map((output) => `
                <li>
                  <span class="check">✓</span>
                  <span>${output}</span>
                </li>
              `).join("")}
            </ol>
            ${profile.isPlaceholder ? `
              <p class="placeholder-note">
                Template ini siap diisi dengan nama jabatan, jadwal, deskripsi bilingual, avatar, dan output harian.
              </p>
            ` : ""}
          </aside>
          `}
        </div>
      `;
    }

    function renderAvatar(profile) {
      if (profile.avatar.type === "image") {
        return `<img src="${profile.avatar.image}" alt="${profile.displayName}">`;
      }
      return `<span aria-hidden="true">${profile.avatar.value}</span>`;
    }

    function countBreaksBefore(activities, index) {
      return activities.slice(0, index).filter((activity) => activity.isBreak).length;
    }

    function setActiveProfile(profileId) {
      const profile = profiles.find((item) => item.id === profileId) || profiles[0];
      if (profile.id === activeProfileId) return;
      renderTabs(profile.id);

      if (!activeProfileId || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        activeProfileId = profile.id;
        renderProfile(profile);
        return;
      }

      window.clearTimeout(flipTimer);
      posterEl.classList.remove("flip-in");
      posterEl.classList.add("flip-out");

      flipTimer = window.setTimeout(() => {
        activeProfileId = profile.id;
        renderProfile(profile);
        posterEl.classList.remove("flip-out");
        posterEl.classList.add("flip-in");

        flipTimer = window.setTimeout(() => {
          posterEl.classList.remove("flip-in");
        }, 280);
      }, 180);
    }

    tabsEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-profile-id]");
      if (!button) return;
      setActiveProfile(button.dataset.profileId);
    });

    setActiveProfile(profiles[0].id);
  </script>
</body>
